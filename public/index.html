<style>
  @font-face {
    font-family: "Orbitron"; font-weight: 900; font-style: normal; font-display: swap;
    src: url("/fonts/orbitron-900-latin.woff2") format("woff2");
  }
  @font-face {
    font-family: "JetBrains Mono"; font-weight: 400; font-style: normal; font-display: swap;
    src: url("/fonts/jetbrains-mono-400-latin.woff2") format("woff2");
  }
  :root {
    --bg: #05050a;
    --red: #ff2a3d;
    --gold: #ffc94d;
    --cyan: #6fe6ff;
    --dim: rgba(255,255,255,.45);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: #fff; }
  body { font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; cursor: crosshair; user-select: none; }
  canvas { position: fixed; inset: 0; display: block; }

  /* 暗角 + 扫描线 */
  .overlay { position: fixed; inset: 0; pointer-events: none; }
  .vignette { background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%); }
  .scan {
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
  }

  /* 副标题 */
  #sub {
    position: fixed; left: 0; right: 0; text-align: center; pointer-events: none;
    padding: 0 16px;
  }
  #sub .line {
    width: 0; height: 1px; margin: 0 auto 22px;
    background: linear-gradient(90deg, transparent, var(--red), var(--gold), transparent);
    transition: width 1.2s cubic-bezier(.2,.8,.2,1);
  }
  #sub .en {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: clamp(11px, 1.4vw, 15px); letter-spacing: .4em; color: rgba(255,255,255,.6);
    opacity: 0; transform: translateY(10px);
    transition: opacity 1s .5s, transform 1s .5s cubic-bezier(.2,.8,.2,1);
  }
  #sub .en b { color: var(--red); font-weight: 400; }
  #sub.show .line { width: min(420px, 70vw); }
  #sub.show .en { opacity: 1; transform: none; }

  /* 四角 HUD */
  .hud {
    position: fixed; font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: .18em; color: var(--dim);
    opacity: 0; transition: opacity 1.2s; pointer-events: none; text-transform: uppercase;
  }
  .hud.show { opacity: 1; }
  .tl { top: 20px; left: 20px; } .tr { top: 20px; right: 20px; text-align: right; }
  .bl { bottom: 20px; left: 20px; } .br { bottom: 20px; right: 20px; text-align: right; }
  .hud i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--red);
           margin-right: 8px; vertical-align: 1px; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  @media (max-width: 600px) { .hud { font-size: 9px; } .tl,.tr{top:16px} .tl,.bl{left:16px} .tr,.br{right:16px} .bl,.br{bottom:16px} }

  /* 大模型排行榜 */
  #rank {
    position: fixed; left: 50%; bottom: 48px; transform: translate(-50%, 12px);
    width: min(900px, calc(100% - 32px));
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px;
    opacity: 0; pointer-events: none;
    transition: opacity .8s, transform .8s cubic-bezier(.2,.8,.2,1);
  }
  #rank.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #rank .head, #rank .foot {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    color: var(--dim); letter-spacing: .18em; font-size: 10px; white-space: nowrap;
  }
  #rank .head { padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,.1); }
  #rank .head b { color: rgba(255,255,255,.75); font-weight: 400; }
  #rank .head b::before {
    content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--red); margin-right: 8px; vertical-align: 1px; animation: blink 1.4s infinite;
  }
  #rank .stat em { font-style: normal; color: var(--gold); font-size: 13px; letter-spacing: .08em; }
  #rank .list {
    display: grid; grid-template-rows: repeat(var(--rows, 5), auto); grid-auto-flow: column;
    grid-auto-columns: 1fr; column-gap: 36px; padding: 4px 0 6px;
  }
  #rank .row {
    display: grid; grid-template-columns: 2em minmax(0, 1fr) 72px 3.6em 4.4em; gap: 10px; align-items: center;
    padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.04);
    color: rgba(255,255,255,.38);
    opacity: 0; transform: translateY(6px); transition: opacity .5s, transform .5s;
  }
  #rank.show .row { opacity: 1; transform: none; }
  #rank .row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  #rank .row .bar { height: 3px; background: rgba(255,255,255,.06); }
  #rank .row .bar i {
    display: block; height: 100%; width: 0; background: rgba(255,255,255,.3);
    transition: width 1.2s cubic-bezier(.2,.8,.2,1);
  }
  #rank .row .tk { text-align: right; }
  #rank .row .ch { text-align: right; font-size: 10px; }
  #rank .row .ch.up { color: var(--gold); }
  #rank .row .ch.new { color: var(--red); letter-spacing: .1em; }
  #rank .row.cn { color: rgba(255,255,255,.9); }
  #rank .row.cn .rk { color: var(--red); }
  #rank .row.cn .bar i { background: linear-gradient(90deg, var(--red), var(--gold)); box-shadow: 0 0 8px rgba(255,80,60,.5); }
  #rank .legend::before { content: ""; display: inline-block; width: 10px; height: 3px; margin-right: 8px; vertical-align: 2px;
                          background: linear-gradient(90deg, var(--red), var(--gold)); }
  #rank .foot { padding-top: 8px; border-top: 1px solid rgba(255,255,255,.06); color: rgba(255,255,255,.3); }
  #rank .foot a { color: inherit; text-decoration: none; }
  #rank .foot a:hover { color: var(--gold); }
  @media (max-width: 640px) {
    #rank { bottom: 40px; }
    #rank .row { grid-template-columns: 2em minmax(0, 1fr) 48px 3.4em; }
    #rank .row .ch { display: none; }
    #rank .head .ttl, #rank .foot .legend { display: none; }
    #rank .foot { justify-content: flex-end; }
    .bl { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; transition-delay: 0s !important; animation: none !important; }
  }
</style>

<body>
<canvas id="c"></canvas>
<div class="overlay vignette"></div>
<div class="overlay scan"></div>

<div id="sub">
  <div class="line"></div>
  <div class="en"><b>+86</b> · INTELLIGENCE FROM CHINA</div>
</div>

<div class="hud tl"><i></i>86.AI // ONLINE</div>
<div class="hud tr" id="clock">BEIJING --:--:--</div>
<div class="hud bl">39.9042° N · 116.4074° E</div>
<div class="hud br">CLICK TO REPLAY</div>

<div id="rank">
  <div class="head"><b><span class="ttl">GLOBAL LLM USAGE · </span>TOP 10 · 30 DAYS</b><span class="stat" id="rankStat"></span></div>
  <div class="list" id="rankList"></div>
  <div class="foot"><span class="legend">CHINA MODELS</span><span><a id="rankSrc" target="_blank" rel="noopener noreferrer">SOURCE · OPENROUTER</a> · <span id="rankSync"></span></span></div>
</div>

<script>
(() => {
  // ====== 可改的文案 ======
  const TEXT_A = '86.Ai';
  const TEXT_B = 'CHINA AI';
  // ========================

  const FONT = '"Orbitron", "Helvetica Neue", Arial, sans-serif';
  const LOW_END = (navigator.hardwareConcurrency || 8) <= 4;
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const BG = '#05050a';
  const cvs = document.getElementById('c');
  const ctx = cvs.getContext('2d');
  const sub = document.getElementById('sub');
  const huds = document.querySelectorAll('.hud');

  let W, H, DPR, fsA, fsB, ptsA, ptsB, gapA, gapB;
  let P = [];               // 粒子
  let layers = new Map();   // 故障文字图层缓存
  let phase, t0, steps, freeMode, flash, mx = -9999, my = -9999;
  const timers = [];
  let quick = false;
  let Rank;

  const rand = (a, b) => a + Math.random() * (b - a);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function fit(text) {
    ctx.font = `900 100px ${FONT}`;
    const w100 = ctx.measureText(text).width;
    return Math.min(H * 0.28, (W * 0.84 * 100) / w100, 340);
  }

  function makeLayer(text, fs, color, glow) {
    const c = document.createElement('canvas');
    c.width = W * DPR; c.height = H * DPR;
    const o = c.getContext('2d');
    o.scale(DPR, DPR);
    o.font = `900 ${fs}px ${FONT}`;
    o.textAlign = 'center'; o.textBaseline = 'middle';
    if (glow) { o.shadowColor = glow; o.shadowBlur = fs * 0.18; }
    o.fillStyle = color;
    o.fillText(text, W / 2, H / 2);
    return c;
  }

  function getLayers(text) {
    if (!layers.has(text)) {
      layers.set(text, {
        r: makeLayer(text, fsA, '#ff1744'),
        c: makeLayer(text, fsA, '#00e5ff'),
        w: makeLayer(text, fsA, '#ffffff', 'rgba(140,230,255,.9)'),
      });
    }
    return layers.get(text);
  }

  function sample(text, fs, cy = H / 2) {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const o = c.getContext('2d', { willReadFrequently: true });
    o.font = `900 ${fs}px ${FONT}`;
    o.textAlign = 'center'; o.textBaseline = 'middle';
    o.fillStyle = '#fff';
    o.fillText(text, W / 2, cy);
    const d = o.getImageData(0, 0, W, H).data;
    const MAX = W < 700 ? 2200 : LOW_END ? 3400 : 5200;
    let gap = Math.max(2, Math.round(fs / 70)), pts;
    for (;;) {
      pts = [];
      for (let y = 0; y < H; y += gap)
        for (let x = 0; x < W; x += gap)
          if (d[(y * W + x) * 4 + 3] > 140) pts.push({ x, y });
      if (pts.length <= MAX || gap > 12) break;
      gap++;
    }
    return { pts: shuffle(pts), gap };
  }

  function scramble(s) {
    const pool = '01#%&@$86A!?/<>X';
    return [...s].map(ch => Math.random() < 0.55 ? pool[(Math.random() * pool.length) | 0] : ch).join('');
  }

  // ---------- 开场闪现时间线 ----------
  function buildSteps() {
    if (quick) return [
      { d: 250, on: false },
      { d: 70, on: true, flash: 1 },
      { d: 650, on: true, g: .35 },
    ];
    return [
      { d: 450, on: false },
      { d: 45, on: true, flash: .9 },
      { d: 110, on: false },
      { d: 60, on: true, text: scramble(TEXT_A), g: 1 },
      { d: 160, on: false },
      { d: 35, on: true, g: .8 },
      { d: 55, on: false },
      { d: 70, on: true, text: scramble(TEXT_A), g: 1 },
      { d: 260, on: false },
      { d: 520, on: true, g: 1 },
      { d: 70, on: false },
      { d: 70, on: true, flash: 1 },
      { d: 950, on: true, g: .3 },
    ];
  }

  function drawGlitch(text, g) {
    const L = getLayers(text);
    const dx = rand(-1, 1) * g * fsA * 0.07;
    const jy = rand(-1, 1) * g * 4;
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(L.r, -dx, jy, W, H);
    ctx.drawImage(L.c, dx, -jy, W, H);
    ctx.drawImage(L.w, 0, 0, W, H);
    // 横向撕裂切片
    const n = (g * 7) | 0;
    for (let i = 0; i < n; i++) {
      const sy = H / 2 + rand(-0.55, 0.55) * fsA;
      const sh = rand(3, fsA * 0.14);
      const off = rand(-1, 1) * g * 70;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = BG;
      ctx.fillRect(0, sy, W, sh);
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(L.w, 0, sy * DPR, W * DPR, sh * DPR, off, sy, W, sh);
    }
    // 噪点线
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 6 * g; i++) {
      ctx.fillStyle = `rgba(255,255,255,${rand(.03, .15)})`;
      ctx.fillRect(0, rand(0, H), W, 1);
    }
  }

  function runIntro(t) {
    let acc = 0;
    for (const s of steps) {
      if (t < acc + s.d) {
        if (s.on) drawGlitch(s.text || TEXT_A, s.g ?? .6);
        if (s.flash) {
          const k = 1 - (t - acc) / s.d;
          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = `rgba(255,255,255,${s.flash * k})`;
          ctx.fillRect(0, 0, W, H);
        }
        return;
      }
      acc += s.d;
    }
    startParticles();
  }

  // ---------- 粒子 ----------
  function startParticles() {
    phase = 'particles';
    const N = Math.max(ptsA.length, ptsB.length) + (W < 700 ? 200 : 450);
    P = [];
    for (let i = 0; i < N; i++) {
      const on = i < ptsA.length;
      const pt = on ? ptsA[i] : { x: rand(0, W), y: rand(0, H) };
      P.push({
        x: pt.x, y: pt.y, tx: pt.x, ty: pt.y,
        vx: on ? rand(-2, 2) : rand(-.3, .3), vy: on ? rand(-2, 2) : rand(-.3, .3),
        on, ph: Math.random() * 6.28,
        r: 255, g: 255, b: 255,
        tr: on ? rand(90, 170) : 120, tg: on ? rand(210, 240) : 140, tb: 255,
        s: on ? gapA * 0.6 : rand(.6, 1.4),
      });
    }
    if (REDUCE) {
      formB(); flash = 0;
      for (const p of P) { p.x = p.tx; p.y = p.ty; p.vx = p.vy = 0; p.r = p.tr; p.g = p.tg; p.b = p.tb; }
      sub.classList.add('show'); huds.forEach(h => h.classList.add('show'));
      Rank.show();
      return;
    }
    const k = quick ? 0.55 : 1;
    at(1500 * k, () => explode());
    at(2250 * k, () => formB());
    at(3300 * k, () => { sub.classList.add('show'); huds.forEach(h => h.classList.add('show')); });
    at(3300 * k + 900, () => Rank.show());
  }

  function explode() {
    freeMode = true; flash = .55;
    for (const p of P) {
      if (!p.on) continue;
      const a = Math.atan2(p.y - H / 2, p.x - W / 2) + rand(-.6, .6);
      const sp = rand(6, 24);
      p.vx += Math.cos(a) * sp; p.vy += Math.sin(a) * sp;
      p.tr = 255; p.tg = 255; p.tb = 255;
    }
  }

  function formB() {
    freeMode = false; flash = .25;
    const left = W / 2 - W * 0.42, span = W * 0.84;
    P.forEach((p, i) => {
      if (i < ptsB.length) {
        const pt = ptsB[i];
        p.on = true; p.tx = pt.x; p.ty = pt.y; p.s = gapB * 0.62;
        const k = Math.min(1, Math.max(0, (pt.x - left) / span));
        // 中国红 → 金
        p.tr = 235 + 20 * k; p.tg = 20 + 170 * Math.pow(k, 1.4) + rand(-12, 12); p.tb = 40 + 10 * k;
      } else {
        p.on = false; p.s = rand(.6, 1.4);
        p.tr = 255; p.tg = 90; p.tb = 80;
      }
    });
  }

  const buckets = new Map();
  function updateParticles(now) {
    // 爆炸时用叠加发光，成形后用正常混合，保证红金颜色饱和
    ctx.globalCompositeOperation = freeMode ? 'lighter' : 'source-over';
    const R = Math.min(W, H) * 0.12, R2 = R * R;
    for (const p of P) {
      if (freeMode && p.on) {
        p.vx *= 0.95; p.vy *= 0.95;
        const dx = p.x - W / 2, dy = p.y - H / 2;
        p.vx += -dy * 0.0009; p.vy += dx * 0.0009; // 漩涡
      } else if (p.on) {
        const jx = REDUCE ? 0 : Math.sin(now * 0.002 + p.ph) * 0.6;
        const jy = REDUCE ? 0 : Math.cos(now * 0.0017 + p.ph) * 0.6;
        p.vx = (p.vx + (p.tx + jx - p.x) * 0.055) * 0.84;
        p.vy = (p.vy + (p.ty + jy - p.y) * 0.055) * 0.84;
      } else {
        p.vx = p.vx * 0.985 + rand(-.03, .03);
        p.vy = p.vy * 0.985 + rand(-.03, .03) - 0.01;
        if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10;
      }
      // 鼠标排斥
      const dx = p.x - mx, dy = p.y - my, d2 = dx * dx + dy * dy;
      if (d2 < R2 && d2 > 1) {
        const d = Math.sqrt(d2), f = (1 - d / R) * 5;
        p.vx += dx / d * f; p.vy += dy / d * f;
      }
      p.x += p.vx; p.y += p.vy;
      p.r += (p.tr - p.r) * 0.06; p.g += (p.tg - p.g) * 0.06; p.b += (p.tb - p.b) * 0.06;

      const key = (((p.r >> 3) << 10) | ((p.g >> 3) << 5) | (p.b >> 3)) * 2 + (p.on ? 1 : 0);
      let arr = buckets.get(key);
      if (!arr) buckets.set(key, (arr = []));
      arr.push(p.x, p.y, p.s);
    }
    for (const [key, arr] of buckets) {
      if (!arr.length) continue;
      const c = key >> 1, r = ((c >> 10) & 31) * 8 + 4, g = ((c >> 5) & 31) * 8 + 4, b = (c & 31) * 8 + 4;
      ctx.fillStyle = key & 1 ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},.35)`;
      ctx.beginPath();
      for (let i = 0; i < arr.length; i += 3) ctx.rect(arr[i], arr[i + 1], arr[i + 2], arr[i + 2]);
      ctx.fill();
      arr.length = 0;
    }
    if (buckets.size > 3000) buckets.clear();
    if (flash > 0.01) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = `rgba(255,255,255,${flash})`;
      ctx.fillRect(0, 0, W, H);
      flash *= 0.86;
    }
  }

  // ---------- 主循环 ----------
  function frame(now) {
    const t = now - t0;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = phase === 'intro' ? BG : 'rgba(5,5,10,.26)';
    ctx.fillRect(0, 0, W, H);
    if (phase === 'intro') runIntro(t); else updateParticles(now);
    requestAnimationFrame(frame);
  }

  function at(ms, fn) { timers.push(setTimeout(fn, ms)); }

  function restart(full) {
    quick = !full && seenBefore();
    Rank.hide();
    timers.forEach(clearTimeout); timers.length = 0;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cvs.width = W * DPR; cvs.height = H * DPR;
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    fsA = fit(TEXT_A); fsB = fit(TEXT_B);
    // 有排行榜时，CHINA AI + 副标题整体上移，给底部榜单让位
    let cyB = H / 2;
    const panelH = Rank.height();
    if (panelH) {
      const subTop = H - (W <= 640 ? 40 : 48) - panelH - 84;  // 副标题区约 60px + 间距
      fsB = Math.min(fsB, (subTop - 18 - 50) / 1.05);
      cyB = Math.min(H / 2, subTop - 18 - fsB * 0.55);
    }
    ({ pts: ptsA, gap: gapA } = sample(TEXT_A, fsA));
    ({ pts: ptsB, gap: gapB } = sample(TEXT_B, fsB, cyB));
    layers = new Map();
    steps = buildSteps();
    P = []; freeMode = false; flash = 0;
    sub.classList.remove('show');
    huds.forEach(h => h.classList.remove('show'));
    sub.style.top = (cyB + fsB * 0.55 + 18) + 'px';
    phase = 'intro'; t0 = performance.now();
    if (REDUCE) startParticles();
  }

  // 北京时间
  const clock = document.getElementById('clock');
  setInterval(() => {
    const s = new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Shanghai', hour12: false });
    clock.textContent = 'BEIJING ' + s;
  }, 1000);

  // 交互
  addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
  addEventListener('pointerleave', () => { mx = my = -9999; });
  addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') { mx = my = -9999; } });
  addEventListener('click', e => { if (!e.target.closest('#rank')) restart(true); });
  addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') restart(true); });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(restart, 250); });

  // 等字体加载（最多 1.5 秒）再开始，保证粒子取样用的是正确字体
  const ready = document.fonts
    ? Promise.race([document.fonts.load(`900 100px Orbitron`), new Promise(r => setTimeout(r, 1500))])
    : Promise.resolve();
  Rank = Rank_();
  // 等字体和榜单数据（榜单最多等 2.5 秒，取不到就不显示榜单）
  Promise.all([ready, Rank.ready(2500)]).then(() => { restart(); requestAnimationFrame(frame); markSeen(); });

  // 首次访问播完整版，之后（12 小时内）播快速版
  function seenBefore() {
    try { return Date.now() - (+localStorage.getItem('86ai.seen') || 0) < 12 * 3600e3; } catch { return false; }
  }
  function markSeen() {
    try { localStorage.setItem('86ai.seen', String(Date.now())); } catch {}
  }

  // ---------- 大模型排行榜 ----------
  function Rank_() {
    const box = document.getElementById('rank');
    const list = document.getElementById('rankList');
    const stat = document.getElementById('rankStat');
    const sync = document.getElementById('rankSync');
    const src = document.getElementById('rankSrc');
    let data = null, visible = false, raf;

    const loading = fetch('/api/rankings')
      .then(r => (r.ok ? r.json() : null))
      .then(j => { if (j && Array.isArray(j.models) && j.models.length) data = j; })
      .catch(() => {});

    const ago = t => {
      const m = Math.max(0, Math.round((Date.now() - t) / 60e3));
      if (m < 60) return (m || 1) + ' MIN AGO';
      const h = Math.round(m / 60);
      return h < 24 ? h + ' H AGO' : Math.round(h / 24) + ' D AGO';
    };

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    function countUp(target, fmt) {
      cancelAnimationFrame(raf);
      const t0 = performance.now(), D = REDUCE ? 0 : 1400;
      const tick = now => {
        const k = D ? Math.min(1, (now - t0) / D) : 1, e = 1 - Math.pow(1 - k, 3);
        stat.innerHTML = fmt(target * e);
        if (k < 1) raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    }

    function render() {
      const { count, rows } = layout();
      const ms = data.models.slice(0, count);
      const max = data.models[0].tokensNum || 1;
      list.style.setProperty('--rows', rows);

      const bars = [];
      list.replaceChildren(...ms.map((m, i) => {
        const row = el('div', 'row' + (m.cn ? ' cn' : ''));
        row.style.transitionDelay = i * 70 + 'ms';
        row.title = `${m.name} · ${m.author}`;
        const bar = el('span', 'bar'), fill = el('i');
        bar.append(fill); bars.push([fill, m.tokensNum / max, i]);
        const ch = /^\+/.test(m.change) ? 'up' : /new/i.test(m.change) ? 'new' : '';
        row.append(
          el('span', 'rk', String(m.rank).padStart(2, '0')),
          el('span', 'nm', m.name),
          bar,
          el('span', 'tk', m.tokens),
          el('span', 'ch ' + ch, /new/i.test(m.change) ? 'NEW' : m.change),
        );
        return row;
      }));
      requestAnimationFrame(() => requestAnimationFrame(() => {
        for (const [fill, w, i] of bars) {
          fill.style.transitionDelay = 300 + i * 70 + 'ms';
          fill.style.width = Math.max(2, w * 100) + '%';
        }
      }));

      const n = data.models.length, cn = data.cnCount;
      const share = data.cnShare;
      countUp(1, k =>
        `CN <em>${Math.round(cn * k)}</em> / ${n}` +
        (share != null ? ` · <em>${(share * k).toFixed(1)}%</em> SHARE` : ''));
      src.href = data.sourceUrl || 'https://openrouter.ai/rankings';
      sync.textContent = 'SYNCED ' + ago(data.updated);
    }

    // 估算榜单高度（与 render 的行数规则一致），没有数据返回 0
    const layout = () => {
      const mobile = innerWidth <= 640, short = innerHeight < 720;
      const count = mobile ? (short ? 3 : 5) : (short ? 6 : 10);
      return { mobile, count, rows: Math.ceil(count / (mobile ? 1 : 2)) };
    };

    return {
      ready: ms => Promise.race([loading, new Promise(r => setTimeout(r, ms))]),
      height: () => (data ? layout().rows * 29 + 64 : 0),
      async show() {
        await loading;
        if (!data || visible) return;
        visible = true; render();
        box.classList.add('show');
      },
      hide() {
        visible = false; cancelAnimationFrame(raf);
        box.classList.remove('show');
      },
    };
  }
})();
</script>
</body>
</html>
